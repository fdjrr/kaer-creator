[project]
name = "kaer-creator"
version = "0.1.0"
description = "Kaer API (api.kaer.ai) account creator: email OTP signup, free-credit grant, API key mint, pure HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.scripts]
kaer-creator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.hatch.build.targets.sdist]
packages = ["src"]

[tool.hatch.build.targets.sdist.force-include]
"main.py" = "main.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
